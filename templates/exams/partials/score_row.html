<div class="flex items-center justify-between p-3 gap-3" id="score-{{ student.pk }}">
  <div class="font-medium">{{ student.name }}</div>
  <form hx-post="{% url 'exam_save_score' exam.pk %}"
        hx-target="#score-{{ student.pk }}" hx-swap="outerHTML"
        class="flex items-center gap-2">
    {% csrf_token %}
    <input type="hidden" name="student_id" value="{{ student.pk }}">
    <input name="score" type="number" step="0.5" min="0" max="{{ exam.max_score }}"
           value="{% if result %}{{ result.score }}{% endif %}"
           placeholder="—" class="w-24 border rounded-lg p-1.5 text-center"
           onchange="this.form.requestSubmit()">
    {% if result %}
      <span class="text-xs {% if result.message_sent %}text-green-600{% else %}text-gray-400{% endif %}">
        {% if result.message_sent %}✓ اتبعت{% else %}لم تُرسل{% endif %}
      </span>
    {% endif %}
  </form>
</div>

{% extends 'base.html' %}
{% block title %}امتحان جديد{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-bold mb-4">امتحان جديد</h1>
  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">المجموعة</label>
      <select name="group" required class="w-full border rounded-lg p-2">
        {% for g in groups %}
        <option value="{{ g.pk }}">{{ g.name }} — {{ g.subject }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">عنوان الامتحان</label>
      <input name="title" required class="w-full border rounded-lg p-2" placeholder="امتحان الشهر / ميدتيرم...">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">الدرجة الكلية</label>
        <input name="max_score" type="number" value="100" step="0.5" class="w-full border rounded-lg p-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">التاريخ</label>
        <input name="date" type="date" value="{{ today }}" class="w-full border rounded-lg p-2">
      </div>
    </div>
    <button class="w-full bg-indigo-600 text-white rounded-lg py-3 font-bold">إنشاء</button>
  </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}طباعة كروت الطلاب{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">طباعة كروت الطلاب</h1>

<form method="get" class="mb-4 flex gap-2 flex-wrap">
  <select name="group" onchange="this.form.submit()" class="border rounded-lg p-2">
    <option value="">كل الطلاب</option>
    {% for g in groups %}
    <option value="{{ g.pk }}" {% if selected_group == g.pk|stringformat:'s' %}selected{% endif %}>
      {{ g.name }} — {{ g.subject }}
    </option>
    {% endfor %}
  </select>
</form>

<form method="post" action="{% url 'student_cards_pdf' %}" target="_blank">
  {% csrf_token %}
  <div class="flex justify-between items-center mb-3">
    <label class="text-sm"><input type="checkbox" id="check-all" class="ml-1"> تحديد الكل</label>
    <button class="bg-indigo-600 text-white rounded-lg px-5 py-2 font-bold">طباعة PDF</button>
  </div>

  <div class="bg-white rounded-xl shadow divide-y max-h-[60vh] overflow-y-auto">
    {% for s in students %}
    <label class="flex items-center gap-3 p-3 hover:bg-gray-50 cursor-pointer">
      <input type="checkbox" name="student_ids" value="{{ s.pk }}" class="student-cb">
      <div>
        <div class="font-semibold">{{ s.name }}</div>
        <div class="text-xs text-gray-500">{{ s.barcode }} · {{ s.get_grade_display }}</div>
      </div>
    </label>
    {% empty %}
    <div class="p-8 text-center text-gray-400">مفيش طلاب</div>
    {% endfor %}
  </div>
</form>

<script>
document.getElementById('check-all')?.addEventListener('change', function() {
  document.querySelectorAll('.student-cb').forEach(cb => cb.checked = this.checked);
});
</script>
{% endblock %}

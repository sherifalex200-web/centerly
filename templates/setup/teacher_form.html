{% extends 'base.html' %}
{% block title %}{% if teacher %}تعديل مدرس{% else %}مدرس جديد{% endif %}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-bold text-white mb-4">{% if teacher %}تعديل مدرس{% else %}مدرس جديد{% endif %}</h1>
  <form method="post" class="rounded-2xl p-6 space-y-4" style="background:rgba(255,255,255,0.95)">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">اسم المدرس *</label>
      <input name="name" value="{{ teacher.name|default:'' }}" required class="w-full border rounded-lg p-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">المادة *</label>
      <input name="subject" value="{{ teacher.subject|default:'' }}" required class="w-full border rounded-lg p-2" placeholder="رياضيات، فيزياء...">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">التليفون</label>
      <input name="phone" value="{{ teacher.phone|default:'' }}" dir="ltr" class="w-full border rounded-lg p-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">نسبة المدرس %</label>
      <input name="percentage" type="number" step="0.01" value="{{ teacher.percentage|default:'70' }}" class="w-full border rounded-lg p-2">
    </div>
    {% if teacher %}
    <div>
      <label class="block text-sm font-medium mb-1">الحالة</label>
      <select name="is_active" class="w-full border rounded-lg p-2">
        <option value="1" {% if teacher.is_active %}selected{% endif %}>مفعّل</option>
        <option value="0" {% if not teacher.is_active %}selected{% endif %}>متوقف</option>
      </select>
    </div>
    {% endif %}
    <button class="w-full bg-indigo-600 text-white rounded-lg py-3 font-bold">حفظ</button>
    <a href="{% url 'teachers_list' %}" class="block text-center text-sm text-gray-500">رجوع</a>
  </form>
</div>
{% endblock %}
